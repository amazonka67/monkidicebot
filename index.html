<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MonkiDice</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #1a1a1a; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; user-select: none; }
        .header { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; box-sizing: border-box; background-color: #111; }
        .balance-pill { background-color: #222; padding: 5px 15px; border-radius: 20px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .avatar { background-color: #4ade80; color: #000; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        
        .main-container { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; padding: 10px; box-sizing: border-box; }
        
        .wheel-container { position: relative; width: 350px; height: 350px; margin-top: 10px; margin-bottom: 20px; }
        .wheel { width: 100%; height: 100%; border-radius: 50%; border: 8px solid #333; transition: transform 5s cubic-bezier(0.1, 0.9, 0.2, 1); box-shadow: 0 0 30px rgba(0,0,0,0.9) inset; }
        .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid white; z-index: 10; }
        
        .bet-panel { background-color: #222; width: 100%; max-width: 400px; border-radius: 15px; padding: 15px; box-sizing: border-box; margin-bottom: 15px; z-index: 20; }
        .bet-header { font-size: 12px; color: #888; margin-bottom: 5px; text-align: left; }
        .bet-controls { display: flex; justify-content: space-between; align-items: center; background-color: #111; border-radius: 10px; padding: 10px; margin-bottom: 10px; }
        .bet-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; padding: 0 15px; }
        .bet-value { font-size: 24px; font-weight: bold; flex-grow: 1; text-align: center; }
        .quick-bets { display: flex; gap: 10px; }
        .quick-btn { flex: 1; background-color: #333; color: white; border: none; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        
        .multipliers { display: flex; gap: 10px; width: 100%; max-width: 400px; justify-content: space-between; z-index: 20; }
        .mult-btn { flex: 1; border: none; padding: 15px 0; border-radius: 10px; font-size: 18px; font-weight: bold; color: white; cursor: pointer; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .m-x2 { background: linear-gradient(180deg, #3b82f6, #2563eb); }
        .m-x3 { background: linear-gradient(180deg, #f59e0b, #d97706); }
        .m-x5 { background: linear-gradient(180deg, #10b981, #059669); }
        .m-x50 { background: linear-gradient(180deg, #ef4444, #dc2626); }

        .tab-content { display: none; width: 100%; flex-direction: column; align-items: center; flex-grow: 1; justify-content: center; }
        .tab-content.active { display: flex; }

        .nav-bar { width: 100%; background-color: #111; display: flex; justify-content: space-around; padding: 15px 0 25px 0; border-top-left-radius: 20px; border-top-right-radius: 20px; z-index: 20;}
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #666; font-size: 12px; cursor: pointer; }
        .nav-item.active { color: #4ade80; }
        .nav-icon { font-size: 20px; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <div style="font-size: 20px; font-weight: bold; font-style: italic;">⚔️ MonkiDice</div>
        <div class="balance-pill"><span style="color: #4ade80;">+</span> <span id="balance">150.00</span> T</div>
        <div class="avatar" id="avatar">U</div>
    </div>

    <div class="tab-content active" id="tab-lobby">
        <div class="wheel-container">
            <div class="pointer"></div>
            <div class="wheel" id="wheel"></div>
        </div>

        <div class="bet-panel">
            <div class="bet-header">СТАВКА</div>
            <div class="bet-controls">
                <button class="bet-btn" onclick="changeBet(-10)">−</button>
                <div class="bet-value" id="bet-amount">10.00</div>
                <button class="bet-btn" onclick="changeBet(10)">+</button>
            </div>
            <div class="quick-bets">
                <button class="quick-btn" onclick="setBet('half')">½</button>
                <button class="quick-btn" onclick="setBet('double')">x2</button>
                <button class="quick-btn" onclick="setBet('max')">MAX</button>
            </div>
        </div>

        <div class="multipliers">
            <button class="mult-btn m-x2" onclick="playGame(2)">x2</button>
            <button class="mult-btn m-x3" onclick="playGame(3)">x3</button>
            <button class="mult-btn m-x5" onclick="playGame(5)">x5</button>
            <button class="mult-btn m-x50" onclick="playGame(50)">x50</button>
        </div>
    </div>

    <div class="tab-content" id="tab-jackpot"><h1>JACKPOT</h1></div>
    <div class="tab-content" id="tab-poker"><h1>POKER</h1></div>
    <div class="tab-content" id="tab-profile"><h1>ПРОФИЛЬ</h1></div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="switchTab('lobby', this)"><div class="nav-icon">📈</div>Лобби</div>
        <div class="nav-item" onclick="switchTab('jackpot', this)"><div class="nav-icon">🎯</div>Jackpot</div>
        <div class="nav-item" onclick="switchTab('poker', this)"><div class="nav-icon">♠️</div>Poker</div>
        <div class="nav-item" onclick="switchTab('profile', this)"><div class="nav-icon">👤</div>Профиль</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); tg.ready();
        const user = tg.initDataUnsafe?.user;
        if (user) document.getElementById('avatar').innerText = user.first_name[0];

        let balance = 150.00;
        let currentBet = 10.00;
        let isSpinning = false;

        // Генерация колеса с 50 секторами
        // 2 сектора x50, остальные распределены
        let wheelSectors = Array(50).fill('x2'); // База x2
        wheelSectors[0] = 'x50'; wheelSectors[25] = 'x50'; // 2 сектора x50
        
        // Добавляем цвета
        let gradientParts = [];
        for (let i = 0; i < 50; i++) {
            let deg = i * 7.2;
            let nextDeg = (i + 1) * 7.2;
            let color = "#3b82f6"; // Синий (x2)
            if (wheelSectors[i] === 'x50') color = "#ef4444";
            else if (i % 3 === 0) { color = "#f59e0b"; wheelSectors[i] = 'x3'; }
            else if (i % 5 === 0) { color = "#10b981"; wheelSectors[i] = 'x5'; }
            
            gradientParts.push(`${color} ${deg}deg ${nextDeg}deg`);
        }
        
        const wheel = document.getElementById('wheel');
        wheel.style.background = `conic-gradient(${gradientParts.join(', ')})`;

        // Переключение вкладок
        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            el.classList.add('active');
        }

        function updateUI() {
            document.getElementById('balance').innerText = balance.toFixed(2);
            document.getElementById('bet-amount').innerText = currentBet.toFixed(2);
        }

        function changeBet(amount) {
            currentBet += amount;
            if (currentBet < 1) currentBet = 1;
            if (currentBet > balance) currentBet = balance;
            updateUI();
        }

        function setBet(type) {
            if (type === 'half') currentBet = currentBet / 2;
            else if (type === 'double') currentBet = currentBet * 2;
            else if (type === 'max') currentBet = balance;
            if (currentBet < 1) currentBet = 1;
            if (currentBet > balance) currentBet = balance;
            updateUI();
        }

        function playGame(selectedMultiplier) {
            if (isSpinning) return;
            if (currentBet > balance) { tg.showAlert("Недостаточно средств!"); return; }

            isSpinning = true;
            balance -= currentBet;
            updateUI();

            // Логика выигрыша: если выбран x50, то шанс 2/50 (4%)
            let isWin = false;
            let finalMult = 1;

            if (selectedMultiplier === 50) {
                // Игрок ставит на x50. Выигрывает только если выпадет сектор x50
                let randomSector = Math.floor(Math.random() * 50);
                if (wheelSectors[randomSector] === 'x50') { isWin = true; finalMult = 50; }
            } else {
                // Игрок ставит на x2, x3, x5. Шанс ~50%, но выплата по выбранному коэффициенту
                isWin = Math.random() < 0.45; 
                finalMult = selectedMultiplier;
            }

            const randomDegrees = Math.floor(Math.random() * 360) + 3600; 
            wheel.style.transform = `rotate(${randomDegrees}deg)`;

            setTimeout(() => {
                if (isWin) {
                    const winAmount = currentBet * finalMult;
                    balance += winAmount;
                    tg.showAlert(`Поздравляем! Вы выиграли ${winAmount.toFixed(2)} T! (x${finalMult})`);
                } else {
                    tg.showAlert("Вы проиграли.");
                }
                updateUI();
                isSpinning = false;
                
                setTimeout(() => { wheel.style.transition = 'none'; wheel.style.transform = 'rotate(0deg)'; }, 100);
                setTimeout(() => { wheel.style.transition = 'transform 5s cubic-bezier(0.1, 0.9, 0.2, 1)'; }, 200);
            }, 5100); 
        }

        updateUI();
    </script>
</body>
</html>
